version: "3.8"
services:
  redis:
    image: redis:6
    ports:
      - "6379:6379"
    networks:
      - app_network
    
  
  auth_service:
    build:
      context: .
      dockerfile: ./auth_service/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env.local
    depends_on:
      - redis
    networks:
      - app_network
  
  roles_service:
    build:
      context: .
      dockerfile: ./roles_service/Dockerfile
    ports:
      - "8001:8001"
    env_file:
      - .env.local  
    depends_on:
      - auth_service
    networks:
      - app_network

  fields_service:
    build:
      context: .
      dockerfile: ./fields_service/Dockerfile
    ports:
      - "8002:8002"
    env_file:
      - .env.local
    depends_on: []
    networks:
      - app_network

  reservations_service:
    build:
      context: .
      dockerfile: ./reservations_service/Dockerfile
    ports:
      - "8003:8003"
    env_file:
      - .env.local
    depends_on:
      - redis
    networks:
      - app_network

  admin_dashboard:
    build:
      context: .
      dockerfile: ./admin_dashboard/Dockerfile
    ports:
      - "8004:8004"
    env_file:
      - .env.local
    depends_on:
      - redis
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

volumes:
  # No external DB volume needed when using SQLite for local testing