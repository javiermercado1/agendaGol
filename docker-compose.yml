version: "3.8"

services:
  auth_service:
    build:
      context: .
      dockerfile: ./auth_service/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./auth.db
    networks:
      - app_network

  roles_service:
    build:
      context: .
      dockerfile: ./roles_service/Dockerfile
    ports:
      - "8001:8001"
    environment:
      - DATABASE_URL=sqlite:///./roles.db
      - AUTH_SERVICE_URL=http://auth_service:8000
    depends_on:
      - auth_service
    networks:
      - app_network

  fields_service:
    build:
      context: .
      dockerfile: ./fields_service/Dockerfile
    ports:
      - "8002:8002"
    environment:
      - DATABASE_URL=sqlite:///./fields.db
      - AUTH_SERVICE_URL=http://auth_service:8000
      - ROLES_SERVICE_URL=http://roles_service:8001
    depends_on:
      - auth_service
      - roles_service
    networks:
      - app_network

  reservations_service:
    build:
      context: .
      dockerfile: ./reservations_service/Dockerfile
    ports:
      - "8003:8003"
    environment:
      - DATABASE_URL=sqlite:///./reservations.db
      - AUTH_SERVICE_URL=http://auth_service:8000
      - ROLES_SERVICE_URL=http://roles_service:8001
      - FIELDS_SERVICE_URL=http://fields_service:8002
    depends_on:
      - auth_service
      - roles_service
      - fields_service
    networks:
      - app_network

  admin_dashboard:
    build:
      context: .
      dockerfile: ./admin_dashboard/Dockerfile
    ports:
      - "8004:8004"
    environment:
      - AUTH_SERVICE_URL=http://auth_service:8000
      - ROLES_SERVICE_URL=http://roles_service:8001
      - FIELDS_SERVICE_URL=http://fields_service:8002
      - RESERVATIONS_SERVICE_URL=http://reservations_service:8003
    depends_on:
      - auth_service
      - roles_service
      - fields_service
      - reservations_service
    networks:
      - app_network

networks:
  app_network:
    driver: bridge